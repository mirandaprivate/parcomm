[package]
name = "ark-ec"
version = "0.5.0"
authors = ["arkworks contributors"]
description = "A library for elliptic curves and pairings"
documentation = "https://docs.rs/ark-ec/"
homepage = "https://arkworks.rs"
repository = "https://github.com/arkworks-rs/algebra"
categories = ["cryptography"]
include = ["Cargo.toml", "src", "README.md", "LICENSE-APACHE", "LICENSE-MIT"]
license = "MIT OR Apache-2.0"
edition = "2021"
rust-version = "1.75"
keywords = ["cryptography", "elliptic-curves", "pairing"]

[dependencies]
ark-std = { version = "0.5.0", default-features = false }
ark-serialize = { git = "https://github.com/a16z/arkworks-algebra", branch = "dev/twist-shout", default-features = false }
ark-ff = { git = "https://github.com/a16z/arkworks-algebra", branch = "dev/twist-shout", default-features = false }
ark-poly = { git = "https://github.com/a16z/arkworks-algebra", branch = "dev/twist-shout", default-features = false }
educe = "0.6.0"
num-bigint = { version = "0.4", default-features = false }
num-traits = { version = "0.2", default-features = false }
num-integer = { version = "0.1", default-features = false }
rayon = { version = "1", optional = true }
zeroize = { version = "1", default-features = false, features = ["zeroize_derive"] }
hashbrown = { version = "0.15", default-features = false, features = ["inline-more", "allocator-api2"] }
itertools = { version = "0.13", default-features = false }

[target.'cfg(all(target_has_atomic = "8", target_has_atomic = "16", target_has_atomic = "32", target_has_atomic = "64", target_has_atomic = "ptr"))'.dependencies]
ahash = { version = "0.8", default-features = false }

[target.'cfg(not(all(target_has_atomic = "8", target_has_atomic = "16", target_has_atomic = "32", target_has_atomic = "64", target_has_atomic = "ptr")))'.dependencies]
fnv = { version = "1.0", default-features = false }

[features]
default = []
std = ["ark-std/std", "ark-ff/std", "ark-serialize/std"]
parallel = ["std", "rayon", "ark-std/parallel", "ark-serialize/parallel"]
