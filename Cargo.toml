[workspace]
members = [
    "atomic_proof",
    "batch",
    "fs",
    "mat",
    "poly-commit",
]
resolver = "2"
exclude = ["third_party/jolt", "third_party/arkworks", "third_party/spongefish", "qafold/f65521", "qafold/koalabear"]

[patch.crates-io]
ark-bn254 = { path = "third_party/arkworks/curves/bn254" }
ark-ff = { path = "third_party/arkworks/ff" }
ark-ec = { path = "vendor/ark-ec" }
ark-serialize = { path = "third_party/arkworks/serialize" }

[patch."https://github.com/a16z/arkworks-algebra"]
ark-ec = { path = "vendor/ark-ec" }

[workspace.package]
version = "0.1.0"
authors = ["arkworks contributors"]
description = "ParComm collection commitments for heterogeneous vectors"
repository = "https://github.com/mirandaprivate/parcomm"
keywords = ["cryptography", "commitments", "elliptic-curves", "pairing", "zksnark"]
include = ["Cargo.toml", "src", "README.md", "LICENSE-APACHE", "LICENSE-MIT"]
categories = ["cryptography"]
license = "MIT/Apache-2.0"
edition = "2021"

[workspace.dependencies]
atomic_proof = {path = "atomic_proof"}
poly-commit = { path = "poly-commit" }
batch = {path = "batch"}
fs = {path = "fs"}
mat = {path = "mat"}

[profile.release]
opt-level = 3
lto = "thin"
incremental = true
debug = true

[profile.test]
opt-level = 3
debug-assertions = true
incremental = true
debug = true
