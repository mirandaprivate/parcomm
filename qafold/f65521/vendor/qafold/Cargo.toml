[package]
name = "mikros-qafold"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[features]
default = ["parallel"]
parallel = ["dep:rayon"]
profile-encoding = []

[dependencies]
rand = "0.8.5"
blake2 = "0.10.6"
blake2s_simd = "=0.5.4"
digest = "0.10.7"
rayon = { version = "1", optional = true }

[dev-dependencies]
serde_json = "1"

[[bench]]
name = "pcs_65521"
harness = false
