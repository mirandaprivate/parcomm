[package]
name = "hyrax-model-bench"
version = "0.1.0"
edition = "2021"
[workspace]
[dependencies]
poly-commit = { path = "native-poly-commit" }
ark-bn254 = "0.5"
ark-ec = "0.5"
ark-ff = "0.5"
ark-poly = "0.5"
ark-serialize = "0.5"
ark-std = "0.5"
ark-crypto-primitives = { version = "0.5", features = ["sponge"] }
rayon = "1"
serde_json = "1"
libc = "0.2"
[profile.release]
opt-level = 3
lto = "thin"

[workspace.package]
version = "0.1.0"
authors = ["arkworks contributors"]
repository = "https://github.com/arkworks-rs/poly-commit"
categories = ["cryptography"]
include = ["src", "Cargo.toml"]
license = "MIT/Apache-2.0"
edition = "2021"
