[package]
name = "batch"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
rayon = "1.8"
tempfile = "3.10"
ark-ff = { version = "0.5", features = ["std"] }
ark-ec = { version = "0.5", features = ["std"] }
ark-bls12-381 = { version = "0.5", features = ["std", "curve"] }
ark-bn254 = { version = "0.5", features = ["std", "curve"] }
ark-std = { version = "0.5", features = ["std"] }
crossbeam-channel = "0.5"
poly-commit = { path = "../poly-commit" }
ark-serialize = { version = "0.5", features = ["std"] }
ark-crypto-primitives = { version = "0.5", features = ["std"] }
mat = { path = "../mat" }
fs = { path = "../fs" }
atomic_proof = { path = "../atomic_proof" }
rand = "0.9"
sha2 = "0.10.8"
jolt-crypto = { git = "https://github.com/mirandaprivate/jolt", rev = "53d5a1eab2897d0eea90cbe12b517af8d3e833a5" }
jolt-blindfold = { git = "https://github.com/mirandaprivate/jolt", rev = "53d5a1eab2897d0eea90cbe12b517af8d3e833a5" }
jolt-claims = { git = "https://github.com/mirandaprivate/jolt", rev = "53d5a1eab2897d0eea90cbe12b517af8d3e833a5" }
jolt-dory = { git = "https://github.com/mirandaprivate/jolt", rev = "53d5a1eab2897d0eea90cbe12b517af8d3e833a5" }
jolt-field = { git = "https://github.com/mirandaprivate/jolt", rev = "53d5a1eab2897d0eea90cbe12b517af8d3e833a5" }
jolt-openings = { git = "https://github.com/mirandaprivate/jolt", rev = "53d5a1eab2897d0eea90cbe12b517af8d3e833a5" }
jolt-poly = { git = "https://github.com/mirandaprivate/jolt", rev = "53d5a1eab2897d0eea90cbe12b517af8d3e833a5" }
jolt-sumcheck = { git = "https://github.com/mirandaprivate/jolt", rev = "53d5a1eab2897d0eea90cbe12b517af8d3e833a5" }
jolt-transcript = { git = "https://github.com/mirandaprivate/jolt", rev = "53d5a1eab2897d0eea90cbe12b517af8d3e833a5" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
bytemuck = "1.23"

[[bench]]
name = "experiment"
harness = false

[[bench]]
name = "experiment_llama"
harness = false

[[bench]]
name = "experiment_llama8B_8bit"
path = "benches/experiment_llama8B_8bit.rs"
harness = false

[[bench]]
name = "experiment_llama8B_16bit"
path = "benches/experiment_llama8B_16bit.rs"
harness = false

[[bench]]
name = "experiment_llama70B_8bit"
path = "benches/experiment_llama70B_8bit.rs"
harness = false

[[bench]]
name = "experiment_llama70B_16bit"
path = "benches/experiment_llama70B_16bit.rs"
harness = false

[[bench]]
name = "packed_eo_ab"
harness = false

[[bench]]
name = "short_field_mul"
harness = false
